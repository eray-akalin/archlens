version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Base image digests in the Dockerfile's ARG defaults (python, uv).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
