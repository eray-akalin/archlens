version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # 0.26.0 segfaults on files > 256 lines (py-tree-sitter#472); pyproject pins <0.26
      - dependency-name: tree-sitter
        versions: ["0.26.0"]

  # Base image digests in the Dockerfile's ARG defaults (python, uv).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
