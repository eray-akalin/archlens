version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # The Dockerfile arrives in M4.1; until then this entry reports "no dependency files".
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
