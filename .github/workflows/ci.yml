name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; jobs ask for more only if they need it (docs/AZURE.md §4).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run pyright

      # Offline only: `scanners` and `live` are excluded by default, and live tests also need
      # ARCHLENS_LIVE_TESTS=1, which CI never sets. Includes the schema drift test.
      - name: Tests
        run: uv run pytest
