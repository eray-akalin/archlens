name: deploy

# Builds the image and pushes it to GHCR tagged with the commit SHA and `latest` (the reusable
# archlens workflow's default; docs/AZURE.md §4). The image is public (ADR-008; approved
# 2026-10-11) and carries no secrets. The `azd deploy` step (environment `prod` with a required
# reviewer) arrives with M4.4.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "eval/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker build --platform linux/amd64 --tag "$image" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Push to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker tag "$IMAGE" "${IMAGE%:*}:latest"
          docker push "${IMAGE%:*}:latest"
          docker logout ghcr.io
