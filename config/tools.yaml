# External scanners, pinned to the versions the adapters were verified against (2026-10-06).
# The Dockerfile (M4.1) installs exactly these and records each `checksum` (sha256 of the
# linux-amd64 release artifact). Local dev: scripts/install_tools.sh. Exact commands and why each
# tool never executes repo code are in the adapter docstrings (src/archlens/facts/scanners/).
tools:
  gitleaks:     {version: 8.30.1, checksum: null, timeout_s: 120}   # dir mode, --redact
  osv-scanner:  {version: 2.6.0, checksum: null, timeout_s: 180}    # --no-resolve; queries the OSV API
  semgrep:      {version: 1.179.0, timeout_s: 300, rulesets: ["p/default"], metrics: "off"}
  hadolint:     {version: 2.15.1, checksum: null, timeout_s: 60}
  checkov:      {version: 3.3.20, timeout_s: 300}
  actionlint:   {version: 1.7.12, checksum: null, timeout_s: 60}
  lizard:       {version: 1.24.1, timeout_s: 120}                   # Python package, used via its API
