[project]
name = "archlens"
version = "0.1.0"
description = "Evidence-backed architecture assessment for Git repositories"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.11",
    "azure-cosmos>=4.9",
    "azure-identity>=1.27.0",
    "azure-monitor-opentelemetry>=1.8.12",
    "azure-storage-blob>=12.31.1",
    "azure-storage-queue>=12.18.1",
    "fastapi>=0.162.0",
    "jinja2>=3.1",
    "lizard>=1.25.1",
    "mcp>=2.2,<3",
    "openai>=3.46.0",
    "opentelemetry-api>=1.45.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-ulid>=4.1.0",
    "pyyaml>=6.0",
    "regex>=2026.11.7",
    "sqlite-vec>=0.1.6",
    # 0.26.0: Point.row/column over-decref → use-after-free on files > 256 lines
    # (tree-sitter/py-tree-sitter#472, fixed upstream, unreleased). Lift when 0.26.1 ships.
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "typer>=0.28.0",
    "uvicorn>=0.32",
    "wcmatch>=12.0",
]

[project.scripts]
archlens = "archlens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "syrupy>=4.7",
    "hypothesis>=6.170.15",
    "ruff>=0.17.4",
    "pyright[nodejs]>=1.1.414",
    "types-pyyaml>=6.0.12.20261103",
    "types-regex>=2026.9.29.20261030",
    "httpx>=0.27",
]

[tool.uv]
# uv-managed CPython: built with loadable SQLite extensions (sqlite-vec) and the same build CI uses.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Docs embed illustrative Python with hand-aligned comments; fixture repos contain planted
# defects on purpose. force-exclude keeps editor/hook invocations on single files from touching them.
extend-exclude = ["*.md", "tests/fixtures"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # modern syntax for the target version
    "B",            # bugbear
    "SIM",          # simplifications
    "RUF",          # ruff-specific
    "PTH",          # pathlib over os.path
    "T20",          # no print() — logging only, except cli.py
    "ASYNC",        # async pitfalls
]

[tool.ruff.lint.per-file-ignores]
"src/archlens/cli.py" = ["T20"]
"scripts/*" = ["T20"]
# Tests embed small input files as one-line literals; splitting them hurts readability.
# ASYNC240: small blocking file reads inside async tests are fine.
"tests/**" = ["E501", "ASYNC240"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/fixtures"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest defaults plus `fixtures`: fixture repos carry their own (never-run) test suites.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "fixtures"]
# Default run excludes scanner-binary and paid tests; a later `-m` on the command line overrides
# this one. The live guard in tests/conftest.py still skips `live` tests without the env var.
addopts = ["-ra", "--strict-markers", "-p", "pytester", "-m", "not scanners and not live"]
markers = [
    "unit: fast, isolated tests (applied automatically to unmarked tests)",
    "integration: offline tests spanning several stages",
    "scanners: need external scanner binaries installed",
    "live: real LLM calls; cost money; need ARCHLENS_LIVE_TESTS=1 in the process environment",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
